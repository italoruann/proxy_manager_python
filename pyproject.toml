[project]
name = "proxy-manager"
version = "0.1.0"
description = "Gerenciador de proxy multiplataforma com regras avançadas por aplicativo e domínio, inspirado no Proxifier."
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
# Versões mínimas escolhidas por serem as primeiras com wheels para Python 3.14.
dependencies = [
    "PySide6>=6.10",
    "psutil>=7.1",
    "platformdirs>=4.0",
    "keyring>=25.0",
    # Só necessário pra ligar o modo transparente no Windows (driver WinDivert); ignorado em outros
    # SOs. No Linux, o modo transparente usa o nftables do sistema — nenhuma dependência extra.
    "pydivert>=2.1; sys_platform == 'win32'",
]

[project.scripts]
proxy-manager = "proxy_manager.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]
# Empacotamento standalone (scripts/build_windows.ps1 e scripts/build_linux.sh).
build = ["pyinstaller>=6.16"]

[tool.uv]
# `uv sync` instala só o grupo dev por padrão; o de build é pedido explicitamente pelos scripts.
default-groups = ["dev"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["proxy_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
