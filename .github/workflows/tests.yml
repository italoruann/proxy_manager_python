name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PySide6 em modo "offscreen" (usado pelo smoke test da GUI) precisa dessas libs no
      # Linux; no runner do Windows o Qt já traz tudo que precisa.
      - name: Instala dependências de sistema do Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Instala dependências Python
        run: pip install -r requirements-dev.txt

      - name: Roda a suíte de testes
        run: pytest tests/ -v
